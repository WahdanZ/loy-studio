name: CI & Release Pipeline (Python + Flutter)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-python:
    name: Test Python (Protocol, JS & Syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run Python protocol tests & checks
        run: |
          pytest -q tests/test_protocol.py
          node --check app/static/app.js
          python -m py_compile app/server.py app/smart_features.py desktop_app.py

  test-flutter:
    name: Test Flutter (Analyze & Pure Dart Protocol)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-python:
    name: Build Python Portable (${{ matrix.label }})
    needs: test-python
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            os: macos-latest
            artifact: LOY-Studio-Python-macOS-arm64
          - label: Windows-x64
            os: windows-latest
            artifact: LOY-Studio-Python-Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview
      - name: Build Python portable app
        run: python build_portable.py
      - name: Package Python macOS zip
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "LOY Studio.app" "LOY-Studio-Python-macOS-arm64.zip"
      - name: Package Python Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\LOY Studio.exe" -DestinationPath "dist\LOY-Studio-Python-Windows-x64.zip" -Force
      - name: Upload Python artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip

  build-flutter:
    name: Build Flutter Standalone (${{ matrix.label }})
    needs: test-flutter
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            cmd: flutter build macos --release
            artifact: LOY-Studio-Flutter-macOS
          - label: Windows
            os: windows-latest
            cmd: flutter build windows --release
            artifact: LOY-Studio-Flutter-Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: ${{ matrix.cmd }}
      - name: Package Flutter macOS zip
        if: runner.os == 'macOS'
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "loy_studio_flutter.app" "LOY-Studio-Flutter-macOS.zip"
      - name: Package Flutter Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "LOY-Studio-Flutter-Windows.zip" -Force
      - name: Upload Flutter artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            flutter_app/build/macos/Build/Products/Release/*.zip
            flutter_app/*.zip

  release:
    name: Publish GitHub Release (Python + Flutter)
    needs: [build-python, build-flutter]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all Python & Flutter artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.zip
