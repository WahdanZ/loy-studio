name: Build Standalone Flutter Desktop App

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter_app/**"
    tags:
      - "flutter-v*"

jobs:
  test-flutter:
    name: Analyze & Test Pure Dart Protocol
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-flutter:
    name: Build Flutter (${{ matrix.label }})
    needs: test-flutter
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/flutter-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            cmd: flutter build macos --release
            artifact: LOY-Studio-Flutter-macOS
          - label: Windows
            os: windows-latest
            cmd: flutter build windows --release
            artifact: LOY-Studio-Flutter-Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: ${{ matrix.cmd }}
      - name: Package macOS bundle
        if: runner.os == 'macOS'
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "loy_studio_flutter.app" "LOY-Studio-Flutter-macOS.zip"
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "LOY-Studio-Flutter-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            flutter_app/build/macos/Build/Products/Release/*.zip
            flutter_app/*.zip
