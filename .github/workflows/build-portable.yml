name: CI & Portable Release Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

# Least privilege by default; only the release job may write.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (tags can be moved). The in-app updater
# trusts what this pipeline publishes, so the pipeline itself must not be swappable.
jobs:
  test:
    name: Verify Protocol, Server, JS & Syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests & checks
        run: |
          pytest -q tests/
          node --check app/static/app.js
          node --check matter/bridge.mjs
          python -m py_compile app/server.py app/smart_features.py app/security.py app/storage.py app/update_signing.py desktop_app.py build_portable.py tools/sign_release.py

  build:
    name: Build Portable (${{ matrix.label }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            os: macos-latest
            artifact: LOY-Studio-macOS-arm64
          - label: Windows-x64
            os: windows-latest
            artifact: LOY-Studio-Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview
      - name: Stamp APP_VERSION from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, pathlib, re
          ver = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          p = pathlib.Path("app/server.py")
          p.write_text(re.sub(r'APP_VERSION = "[^"]+"', f'APP_VERSION = "{ver}"', p.read_text(encoding="utf-8")), encoding="utf-8")
          print("Stamped APP_VERSION =", ver)
      - name: Build portable app
        run: python build_portable.py
      - name: Smoke-test the frozen app (imports, routes, data dir)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            "dist/LOY Studio.app/Contents/MacOS/LOY Studio" --self-test
          else
            "dist/LOY Studio.exe" --self-test
          fi
      - name: Package macOS portable zip
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "LOY Studio.app" "LOY-Studio-macOS-arm64.zip"
      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\LOY Studio.exe" -DestinationPath "dist\LOY-Studio-Windows-x64.zip" -Force
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums & signature for the in-app updater
        env:
          LOY_UPDATE_SIGNING_KEY: ${{ secrets.LOY_UPDATE_SIGNING_KEY }}
        run: |
          python tools/sign_release.py sums release-assets
          python tools/sign_release.py sign release-assets/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.sig
